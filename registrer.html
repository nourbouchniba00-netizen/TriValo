<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Créer un compte</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #2e7d32 0%, #1565c0 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 30px; width: 360px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .logo { width: 100px; margin-bottom: 15px; border-radius: 50%; }
        h2 { color: #2e7d32; margin-bottom: 25px; font-weight: bold; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #2e7d32; }
        button { width: 100%; padding: 14px; background-color: #2e7d32; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1b5e20; }
        .footer-text { margin-top: 20px; font-size: 14px; color: #666; }
        a { color: #1565c0; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <img src="1000031217.jpeg" class="logo">
        <h2>Rejoindre TriValo</h2>
        <input type="email" id="reg-email" placeholder="Votre Email" required>
        <input type="password" id="reg-password" placeholder="Mot de passe" required>
        <input type="name" id="reg-name" placeholder="Votre Nom" required>
        <button onclick="registrer()">CRÉER MON COMPTE</button>
        <p class="footer-text">Déjà inscrit ? <a href="index.html">Se connecter</a></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE",
            authDomain: "trivalo-d676f.firebaseapp.com",
            databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com",
            projectId: "trivalo-d676f"
        };
        firebase.initializeApp(firebaseConfig);

        function registrer() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const name= document.getElementById('reg-name').value;

            // Etape 3 : Création de l'identité (Auth)
            firebase.auth().createUserWithEmailAndPasswordAndName(email, password,name)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // Etape 7 : Initialisation du profil dans Realtime Database
                    return firebase.database().ref('users/' + user.uid + '/stats').set({
                        Plastique: 0,
                        Metal: 0,
                        Papier: 0
                    });
                })
                .then(() => {
                    alert("Compte créé avec succès ! Bienvenue chez TriValo.");
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    alert("Erreur : " + error.message);
                });
        }
    </script>
</body>
</html>
