<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Inscription</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>Créer un compte Citoyen</h2>
        <input type="email" id="email" placeholder="Email"><br><br>
        <input type="password" id="pass" placeholder="Mot de passe"><br><br>
        <button onclick="register()">S'inscrire</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE", authDomain: "trivalo-d676f.firebaseapp.com", databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com", projectId: "trivalo-d676f" };
        firebase.initializeApp(firebaseConfig);

        function register() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            // Etape 3 : Création identité
            firebase.auth().createUserWithEmailAndPassword(email, pass)
            .then((res) => {
                // Etape 7 : Initialisation profil
                return firebase.database().ref('users/' + res.user.uid + '/stats').set({
                    Plastique: 0, Metal: 0, Papier: 0
                });
            })
            .then(() => {
                alert("Succès !");
                window.location.href = "login.html"; // Redirection
            }).catch(e => alert(e.message));
        }
    </script>
</body>
</html>
