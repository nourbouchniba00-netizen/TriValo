<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Créer un compte</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #2e7d32 0%, #1565c0 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 25px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .logo { width: 120px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #1565c0; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        a { color: #1565c0; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <img src="1000031217.jpeg" class="logo">
        <h2>Créer un compte</h2>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Mot de passe" required>
        <button onclick="register()">S'INSCRIRE</button>
        <p><a href="index.html">Déjà un compte ? Se connecter</a></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE",
            authDomain: "trivalo-d676f.firebaseapp.com",
            databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com",
            projectId: "trivalo-d676f",
            storageBucket: "trivalo-d676f.firebasestorage.app",
            messagingSenderId: "307780329848",
            appId: "1:307780329848:web:850217d7edfeb2104d288d"
        };
        
        firebase.initializeApp(firebaseConfig);

        function register() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            firebase.auth().createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return firebase.database().ref('users/' + user.uid + '/stats').set({
                        plastique: 0,
                        Metal: 0,
                        Papier: 0
                    });
                })
                .then(() => {
                    alert("Compte TriValo créé avec succès !");
                    window.location.href = "login.html";
                })
                .catch((error) => {
                    alert("Erreur : " + error.message);
                });
        }
    </script>
</body>
</html>
