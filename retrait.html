<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Retrait</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div style="text-align: center;">
        <img src="1000031217.jpeg" width="80"> <h2>Interface Retrait</h2>
        <p>Solde actuel: <b id="display-solde">0.000</b> TND</p>
        <button onclick="handleWithdraw(0.500)">Retirer 0.500 TND</button><br><br>
        <a href="dash.html">Retour au Dashboard</a>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE", authDomain: "trivalo-d676f.firebaseapp.com", databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com", projectId: "trivalo-d676f" };
        firebase.initializeApp(firebaseConfig);
        
        let userUID = null;
        let currentTotal = 0; // CORRECTION : Variable définie ici pour éviter l'erreur console

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                userUID = user.uid;
                // Etape 2 & 3 du diagramme Retrait
                firebase.database().ref('users/' + userUID + '/stats').on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        currentTotal = (data.Plastique * 0.100) + (data.Metal * 0.200);
                        document.getElementById('display-solde').innerText = currentTotal.toFixed(3);
                    }
                });
            }
        });

        function handleWithdraw(montant) {
            // Etape 6 : Vérification locale
            if (currentTotal < montant) {
                alert("Points insuffisants !");
                return;
            }

            // Etape 8 : runTransaction anti double-dépense
            firebase.database().ref('users/' + userUID + '/stats').transaction((stats) => {
                if (stats) {
                    stats.Plastique -= (montant / 0.100); 
                    return stats;
                }
            }, (err, committed) => {
                if (committed) {
                    // Etape 13 : Historique
                    const code = "VALO-" + Math.floor(Math.random()*9000);
                    alert("Succès ! Votre code de récompense abientôt été généré : " + code);
                }
            });
        }
    </script>
</body>
</html>
