<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriValo - Retrait de Récompense</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --primary-green: #2e7d32; --secondary-blue: #1565c0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header img { width: 100px; margin-bottom: 10px; }
        h2 { color: var(--primary-green); margin-bottom: 20px; }
        
        .balance-card { background: var(--primary-green); color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; }
        .balance-value { font-size: 2.5em; font-weight: bold; }

        .reward-option { border: 2px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; cursor: pointer; }
        .reward-option:hover { border-color: var(--primary-green); background-color: #f1f8e9; }
        .reward-info { text-align: left; }
        .reward-info b { display: block; font-size: 1.1em; color: #333; }
        
        .btn-action { background: var(--primary-green); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        #status-msg { margin-top: 15px; padding: 10px; border-radius: 10px; display: none; font-weight: bold; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }

        .reward-result { margin-top: 20px; padding: 20px; border: 3px dashed #fb8c00; background: #fff3e0; border-radius: 15px; display: none; }
        .reward-code { font-size: 2em; font-weight: 900; color: #ef6c00; letter-spacing: 3px; margin: 10px 0; }
        .btn-back { display: block; margin-top: 25px; color: #666; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="1000031217.jpeg" alt="TriValo">
            <h2>Retrait Récompense</h2>
        </div>

        <div class="balance-card">
            <p style="margin:0;">Votre Solde</p>
            <span id="display-solde" class="balance-value">0.000</span> <small>TND</small>
        </div>

        <h3 style="text-align: left; font-size: 1em; color: #555;">Récompenses disponibles :</h3>

        <div class="reward-option" onclick="handleWithdraw(1.000, 'BON_ACHAT')">
            <div class="reward-info">
                <b>Bon d'achat 1.000 DT</b>
                <small>Valable en magasin</small>
            </div>
            <button class="btn-action">Choisir</button>
        </div>

        <div class="reward-option" onclick="handleWithdraw(0.500, 'RECHARGE')">
            <div class="reward-info">
                <b>Recharge 0.500 DT</b>
                <small>Ooredoo, Orange, TT</small>
            </div>
            <button class="btn-action">Choisir</button>
        </div>

        <div id="status-msg"></div>

        <div id="reward-result" class="reward-result">
            <p style="margin:0; font-weight: bold;">Félicitations !</p>
            <p style="font-size: 0.8em; color: #777;">Utilisez ce code pour votre retrait :</p>
            <div id="final-code" class="reward-code">-------</div>
            <p style="font-size: 0.7em; color: #999;">Le montant a été déduit de votre compte.</p>
        </div>

        <a href="dash.html" class="btn-back">← Retour au Dashboard</a>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE",
            authDomain: "trivalo-d676f.firebaseapp.com",
            databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com",
            projectId: "trivalo-d676f"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let userUID = null;
        let currentTotal = 0;

        // 1 & 2. Authentification et récupération du solde
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                userUID = user.uid;
                database.ref('users/' + userUID + '/stats').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        currentTotal = (data.Plastique * 0.100) + (data.Metal * 0.200) + (data.Papier * 0.050);
                        document.getElementById('display-solde').innerText = currentTotal.toFixed(3);
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        function handleWithdraw(montant, type) {
            const statusDiv = document.getElementById('status-msg');
            const resultDiv = document.getElementById('reward-result');
            
            // 6. Vérification locale
            if (currentTotal < montant) {
                showStatus("Points insuffisants pour cette récompense !", "error");
                return;
            }

            // 8. runTransaction() : Indispensable pour l'anti double-dépense
            database.ref('users/' + userUID + '/stats').transaction((stats) => {
                if (stats) {
                    let realTotal = (stats.Plastique * 0.100) + (stats.Metal * 0.200) + (stats.Papier * 0.050);
                    if (realTotal >= montant) {
                        // Déduction des points (exemple réparti)
                        stats.Plastique -= (montant / 0.100) / 2;
                        stats.Metal -= (montant / 0.200) / 2;
                        return stats;
                    }
                }
                return; // Annule si le solde a changé entre temps
            }, (error, committed) => {
                if (committed) {
                    // 12. Succès
                    showStatus("Retrait effectué avec succès !", "success");
                    
                    // 13. Génération du code et push vers historique
                    const rewardCode = "VALO-" + Math.random().toString(36).substr(2, 6).toUpperCase();
                    
                    database.ref('transactions/' + userUID).push({
                        type: type,
                        montant: montant,
                        code: rewardCode,
                        date: new Date().toISOString()
                    });

                    // 14. Affichage du résultat
                    document.getElementById('final-code').innerText = rewardCode;
                    resultDiv.style.display = 'block';
                } else {
                    // 11. Erreur
                    showStatus("Opération impossible, solde expiré.", "error");
                }
            });
        }

        function showStatus(txt, cls) {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.innerText = txt;
            statusDiv.className = cls;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
