<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Retrait</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div style="text-align: center; padding: 20px;">
        <h2>Interface de Retrait</h2>
        <p>Solde disponible : <b id="display-solde">0.000</b> TND</p>
        
        <hr>
        <h3>Choisir le type de récompense</h3>
        <select id="reward-type" style="padding: 10px; width: 250px;">
            <option value="BON">Bon d'achat (Magasin)</option>
            <option value="TEL">Recharge Téléphonique</option>
        </select>
        <br><br>
        <input type="number" id="amount" placeholder="Montant à retirer (ex: 1.000)" step="0.100" style="padding: 10px;"><br><br>
        
        <button onclick="confirmWithdraw()" style="padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer;">
            CONFIRMER LE RETRAIT
        </button>

        <p><a href="dash.html">Retour au Dashboard</a></p>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE", authDomain: "trivalo-d676f.firebaseapp.com", databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com", projectId: "trivalo-d676f" };
        firebase.initializeApp(firebaseConfig);

        let userUID = null;
        let currentTotal = 0;

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                userUID = user.uid;
                firebase.database().ref('users/' + userUID + '/stats').on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        currentTotal = (data.Plastique * 0.100) + (data.Metal * 0.200) + ((data.Papier || 0) * 0.050);
                        document.getElementById('display-solde').innerText = currentTotal.toFixed(3);
                    }
                });
            }
        });

        function confirmWithdraw() {
            const montant = parseFloat(document.getElementById('amount').value);
            
            if (isNaN(montant) || montant <= 0) {
                alert("Veuillez saisir un montant valide.");
                return;
            }

            // Vérification du solde insuffisant
            if (currentTotal < montant) {
                alert("Solde insuffisant pour ce retrait.");
                return;
            }

            // Simulation de transaction réussie
            alert("Succès ! Retrait généré bientôt. Vous recevrez votre code par SMS.");
            // Ici tu peux ajouter le code firebase.transaction pour déduire le montant
        }
    </script>
</body>
</html>
