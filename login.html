<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriValo - Connexion</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2e7d32 0%, #1565c0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        .logo-img {
            width: 150px; /* Taille de ton logo */
            margin-bottom: 20px;
        }
        h2 {
            color: #2e7d32;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #2e7d32;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #1b5e20;
            transform: scale(1.02);
        }
        .footer {
            margin-top: 20px;
            font-size: 0.85em;
            color: #777;
        }
        .footer a {
            color: #1565c0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="1000031217.jpeg" alt="Logo TriValo" class="logo-img">
        
        <h2>Bienvenue chez TriValo</h2>
        
        <form>
            <input type="text" placeholder="Email ou Utilisateur" required>
            <input type="password" placeholder="Mot de passe" required>
            
            <button type="button" onclick="window.location.href='index.html'">SE CONNECTER</button>
        </form>

        <div class="footer">
            Nouveau ici ? <a href="#">Créer un compte</a>
        </div>
    </div>

</body>
</html>
