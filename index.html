<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Connexion</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1565c0 0%, #2e7d32 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 30px; width: 360px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .logo { width: 100px; margin-bottom: 15px; border-radius: 50%; }
        h2 { color: #1565c0; margin-bottom: 25px; font-weight: bold; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; background-color: #1565c0; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #0d47a1; transform: translateY(-2px); }
        .footer-text { margin-top: 20px; font-size: 14px; color: #666; }
        a { color: #2e7d32; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <img src="1000031217.jpeg" class="logo">
        <h2>Connexion Citoyen</h2>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Mot de passe" required>
        <button onclick="login()">SE CONNECTER</button>
        <p class="footer-text">Pas encore de compte ? <a href="registrer.html">S'inscrire</a></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE",
            authDomain: "trivalo-d676f.firebaseapp.com",
            databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com",
            projectId: "trivalo-d676f"
        };
        firebase.initializeApp(firebaseConfig);

        function login() {
            const email = document.getElementById('login-email').value;
            const mdp = document.getElementById('login-password').value;

            // Etape 3 : signInWithEmailAndPassword
            firebase.auth().signInWithEmailAndPassword(email, mdp)
                .then((userCredential) => {
                    // Etape 7 : Redirection vers le Dash
                    window.location.href = "dash.html";
                })
                .catch((error) => {
                    // Etape 5 : Afficher message d'erreur
                    alert("Erreur de connexion : " + error.message);
                });
        }
    </script>
</body>
</html>
