<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Bienvenue</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #2e7d32 0%, #1565c0 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 30px; width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .logo { width: 110px; margin-bottom: 20px; border-radius: 50%; }
        h1 { color: #2e7d32; margin-bottom: 30px; }
        .btn { display: block; padding: 15px; margin-bottom: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-login { background: #1565c0; color: white; }
        .btn-reg { background: #2e7d32; color: white; }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <img src="1000031217.jpeg" class="logo" alt="TriValo"> <h1>TriValo</h1>
        <p>Gagnez des points en triant vos déchets.</p>
        <a href="login.html" class="btn btn-login">Se Connecter</a>
        <a href="registrer.html" class="btn btn-reg">Créer un compte</a>
    </div>
</body>
</html>
