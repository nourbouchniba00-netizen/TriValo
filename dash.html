<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TriValo - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        .header { display: flex; justify-content: space-between; padding: 20px; background: #eee; }
        .stats { display: flex; gap: 20px; justify-content: center; margin-top: 50px; }
        .card { padding: 20px; border: 1px solid #ccc; border-radius: 10px; width: 150px; text-align: center; }
        .btn-retrait { display: block; width: 200px; margin: 30px auto; padding: 15px; background: #2e7d32; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <img src="1000031217.jpeg" width="50" alt="Logo"> <button onclick="logout()">Déconnexion</button> </div>

    <div class="stats">
        <div class="card"><h3>Plastique</h3><span id="p-val">0</span></div>
        <div class="card"><h3>Métal</h3><span id="m-val">0</span></div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <h2>Total Gains: <span id="total-gains">0.000</span> TND</h2>
    </div>

    <a href="retrait.html" class="btn-retrait">Aller au Retrait →</a>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAPGDOcBFa21jY_2rkH4qJRwLcqDLRPrcE", authDomain: "trivalo-d676f.firebaseapp.com", databaseURL: "https://trivalo-d676f-default-rtdb.firebaseio.com", projectId: "trivalo-d676f" };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // Etape 8 : Interface mise à jour
                firebase.database().ref('users/' + user.uid + '/stats').on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        document.getElementById('p-val').innerText = data.Plastique;
                        document.getElementById('m-val').innerText = data.Metal;
                        let total = (data.Plastique * 0.100) + (data.Metal * 0.200);
                        document.getElementById('total-gains').innerText = total.toFixed(3);
                    }
                });
            } else { window.location.href = "login.html"; }
        });

        function logout() { firebase.auth().signOut().then(() => { window.location.href = "login.html"; }); }
    </script>
</body>
</html>
